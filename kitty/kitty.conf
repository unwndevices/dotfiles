# config
confirm_os_window_close 0

# ignore new terminal shortcut
map ctrl+shift+n

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

# Enable fast remote control from external scripts
# Use abstract socket to avoid PID appending and filesystem issues
listen_on unix:@mykitty
allow_remote_control yes

#transparent, blurred background
background_opacity 0.85
background_blur 10


# BEGIN_KITTY_FONTS
font_family      family="Hack Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Map shift+enter to send backslash + enter for newline continuation
map shift+enter send_text all \\\r
