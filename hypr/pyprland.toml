[pyprland]
plugins = ["scratchpads"]

[scratchpads.term]
command = "kitty --class term"
class = "term"
animation = "fromBottom"
margin = 40
size = "50% 50%"
allow_special_workspace = true

[scratchpads.perplexity]
command = "perplexity-ai-app"
class = "Perplexity AI"
animation = "fromTop"
margin = 40
size = "60% 70%"
allow_special_workspace = true

[scratchpads.yazi]
command = "kitty --class yazi yazi"
class = "yazi"
unfocus = "hide"
hysteresis = 0.8
animation = "fromTop"
margin = 40
size = "90% 90%"
allow_special_workspace = true

[scratchpads.btop]
command = "kitty --class btop btop"
class = "btop"
unfocus = "hide"
hysteresis = 0.8
animation = "fromTop"
margin = 40
size = "50% 50%"
allow_special_workspace = true

[scratchpads.lazygit]
command = "kitty --class lazygit lazygit"
class = "lazygit"
unfocus = "hide"
hysteresis = 0.8
animation = "fromTop"
margin = 40
size = "90% 90%"
allow_special_workspace = true
