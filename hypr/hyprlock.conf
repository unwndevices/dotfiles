source=~/.config/hypr/current-theme.conf

$lock_bg = $surface
$lock_inner = $text
$lock_outer = $iris
$lock_font = $base
$lock_check = $surface

general {
  hide_cursor = true
  enable_fingerprint = true
}

background {
  monitor =
  color = $lock_bg
}

animations {
  enabled = true
}

input-field {
  monitor =
  size = 400, 75
  position = 0, 0
  halign = center
  valign = center

  inner_color = $overlay
  outer_color = $lock_outer
  outline_thickness = 2

  font_family = Departure Mono Regular
  font_color = $gold

  placeholder_text = <span foreground="##6e6a86"><i> pwd 󰈷 </i></span>
  check_color = $lock_check
  fail_text = <i>retry</i>

  rounding = 3
  shadow_passes = 0
  fade_on_empty = false
}

auth {
  fingerprint:enabled = true
}
