
 
# windowrule = float,float:0,fullscreen:0
windowrule = float,class:(xdg-desktop-portal-gtk)
windowrule = maxsize 1000 700,class:(xdg-desktop-portal-gtk)

windowrule = nodim,initialClass:^(Gimp)(.*)$
windowrule = noblur,initialClass:^(Gimp)(.*)$
windowrule = opaque,initialClass:^(Gimp)(.*)$
windowrule = stayfocused,initialClass:^(Gimp)(.*)$,floating:1
windowrule = minsize 1 1,initialClass:^(Gimp)(.*)$,floating:1
windowrule = noanim,initialClass:^(Gimp)(.*)$,floating:1

windowrule = nodim,xwayland:1,floating:1
windowrule = noanim,xwayland:1,floating:1
windowrule = noblur,xwayland:1,floating:1



windowrule = float,class:(main.py)
windowrule = float,class:(app_launcher.py)
windowrule = float,class:(waypaper)
windowrule = nodim,fullscreen:1
windowrule = pin,class:(showmethekey)
windowrule = nodim,class:(showmethekey)
windowrule = opaque,class:(showmethekey)

windowrule = nodim,class:^(windowbg)$
windowrule = noblur,class:^(windowbg)$
# windowrule = nodim,class:^(.*)(-bg)$
# windowrule = noblur,class:^(.*)(-bg)$

windowrule = float, class:(clipse)
windowrule = size 622 652, class:(clipse)

$tk = class:^(Tk)$
windowrule = float,$tk
windowrule = size 40% 70%,$tk

#scratchpads

$scratchpad = class:^(scratchpad)$
windowrule = float,$scratchpad
windowrule = size 30% 20%,$scratchpad
windowrule = move 100%-w-20 100%-w-20,$scratchpad

$term = class:^(term)$
windowrule = float,$term
windowrule = opacity 0.8 0.65, $term
windowrule = workspace special silent,$term

$yazi = class:^(yazi)$
windowrule = float,$yazi
windowrule = workspace special silent,$yazi

$perplexity = class:^(Perplexity AI)$
windowrule = float,$perplexity
windowrule = workspace special silent,$perplexity
windowrule = opacity 0.85 0.65, $perplexity

$btop = class:^(btop)$
windowrule = float,$btop
windowrule = workspace special silent,$btop

# KICAD rules

$kicad = title:^.*KiCad\s\d+(\.\d+)*$
windowrule = tile,$kicad
windowrule = opacity 0.8 0.55, $kicad

