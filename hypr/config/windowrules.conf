# Window rules for KiCad dialogs to be floating, sized, and centered
windowrule = float,class:^(kicad)$,title:.*(Preferences)$
windowrule = size 80% 80%,class:^(kicad)$,title:.*(Preferences)$
windowrule = center,class:^(kicad)$,title:.*(Preferences)$

windowrule = float,class:^(kicad)$,title:.*(Properties)$
windowrule = size 80% 50%,class:^(kicad)$,title:.*(Properties)$
windowrule = center,class:^(kicad)$,title:.*(Properties)$

windowrule = float,class:^(kicad)$,title:.*Symbol Libraries$
windowrule = size 80% 80%,class:^(kicad)$,title:.*Symbol Libraries$
windowrule = center,class:^(kicad)$,title:.*Symbol Libraries$

windowrule = float,class:^(kicad)$,title:.*Footprint Editor$
windowrule = size 80% 80%,class:^(kicad)$,title:.*Footprint Editor$
windowrule = center,class:^(kicad)$,title:.*Footprint Editor$

windowrule = float,class:^(kicad)$,title:.*(Library Editor)$
windowrule = size 80% 80%,class:^(kicad)$,title:.*(Library Editor)$
windowrule = center,class:^(kicad)$,title:.*(Library Editor)$


windowrule = float,class:^(Mailspring)$
windowrule = center,class:^(Mailspring)$
windowrule = size 70% 70%,class:^(Mailspring)$

windowrule = float,class:^(Slack)$
windowrule = center,class:^(Slack)$
windowrule = size 70% 70%,class:^(Slack)$

windowrule = float,class:^(discord)$
windowrule = center,class:^(discord)$
windowrule = size 70% 70%,class:^(discord)$

windowrule = tile,class:^(Aseprite)$

windowrule = float,class:^(mpv)$
windowrule = center,class:^(mpv)$
windowrule = size 90% 90%,class:^(mpv)$

windowrule = float,class:^(lazygit)$
windowrule = center,class:^(lazygit)$
windowrule = size 90% 90%,class:^(lazygit)$

layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = ignorealpha 0.5, waybar

layerrule = blur, rofi
layerrule = ignorealpha 0.85, rofi
layerrule = dimaround, rofi
